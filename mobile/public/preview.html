<!doctype html>
<meta charset="utf-8" />
<title>Avenza — screen preview</title>
<!--
  Dev-only harness. Loads each route in a 402x874 frame (an iPhone 16 Pro logical
  viewport) so screens can be compared side by side against design/src/*.body.html.
  Not part of the app; served from public/ only while the dev server runs.
-->
<style>
  html, body { margin: 0; background: #6b6b6b; font: 12px/1.4 system-ui, sans-serif; color: #fff; }
  .row { display: flex; gap: 10px; padding: 10px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { padding: 4px 2px; font-weight: 600; letter-spacing: .02em; }
  .shell { width: 402px; height: 874px; overflow: hidden; background: #FBF8F3;
           box-shadow: 0 4px 18px rgba(0,0,0,.45); }
  iframe { width: 402px; height: 874px; border: 0; display: block; }
</style>
<div class="row" id="row"></div>
<script>
  const SCREENS = [
    ['/', 'Welcome'],
    ['/onboarding/sports', 'Sports'],
    ['/onboarding/level', 'Level'],
    ['/onboarding/ready', 'Ready'],
    ['/(tabs)', 'Discover'],
    ['/activity/padel-caddebostan', 'Activity'],
    ['/rate', 'Rate'],
  ];
  const params = new URLSearchParams(location.search);
  const only = params.get('only');
  const scale = parseFloat(params.get('scale') || '1');
  const row = document.getElementById('row');
  for (const [path, name] of SCREENS) {
    if (only && !only.split(',').includes(name.toLowerCase())) continue;
    const fig = document.createElement('figure');
    const cap = document.createElement('figcaption');
    cap.textContent = name;
    const shell = document.createElement('div');
    shell.className = 'shell';
    const f = document.createElement('iframe');
    f.src = path;
    shell.appendChild(f);
    fig.appendChild(cap);
    fig.appendChild(shell);
    row.appendChild(fig);
    if (scale !== 1) {
      shell.style.transform = `scale(${scale})`;
      shell.style.transformOrigin = 'top left';
      shell.style.width = `${402 * scale}px`;
      shell.style.height = `${874 * scale}px`;
      f.style.transform = `scale(${scale})`;
      f.style.transformOrigin = 'top left';
      shell.style.overflow = 'hidden';
    }
  }
</script>
